[package]
name = "laudit-core"
description = "Editor-agnostic engine for laudit guided codebase tours"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync"] }
toml = { version = "0.8.19", default-features = false, features = ["parse"] }
