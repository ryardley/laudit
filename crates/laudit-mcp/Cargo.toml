[package]
name = "laudit-mcp"
description = "MCP stdio server exposing laudit engine tools to AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "laudit_mcp"
path = "src/lib.rs"

[[bin]]
name = "laudit-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
laudit-core = { path = "../laudit-core" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"
