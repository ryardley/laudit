[package]
name = "laudit-cli"
description = "Command-line frontend for laudit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "laudit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "~4.5.61", features = ["derive"] }
laudit-core = { path = "../laudit-core" }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
