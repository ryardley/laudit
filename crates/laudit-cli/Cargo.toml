[package]
name = "laudit-cli"
description = "Command-line frontend for laudit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "laudit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "~4.5.61", features = ["derive"] }
laudit-core = { path = "../laudit-core" }
laudit-tui = { path = "../laudit-tui" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "time", "macros"] }

[dev-dependencies]
serde_json = "1.0.154"
wiremock = "0.6.5"
