[package]
name = "laudit-tui"
description = "Interactive terminal tour for laudit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "laudit_tui"
path = "src/lib.rs"

[[bin]]
name = "laudit-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
crossterm = "0.28.1"
laudit-core = { path = "../laudit-core" }
ratatui = "0.29.0"
tokio = { version = "1.53.3", features = ["rt", "time"] }
