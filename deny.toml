[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is a transitive dependency of syntect's dump-load feature; no safe upgrade exists and it only deserializes bundled syntax/theme dumps, not untrusted input." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
